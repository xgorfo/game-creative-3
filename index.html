<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tuition Quest</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1d1d1b;--mut:#6b6a63;--ac:#2f6f4f;--bad:#b3392f;--bd:#ddd9cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222426;--tx:#f0efe9;--mut:#a3a199;--ac:#5fbf8c;--bad:#ef7b70;--bd:#3a3c3f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--card:#222426;--tx:#f0efe9;--mut:#a3a199;--ac:#5fbf8c;--bad:#ef7b70;--bd:#3a3c3f;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:14px;margin-bottom:12px}
.hud{display:flex;justify-content:space-between;font-weight:600;margin:8px 0}
.bar{height:14px;background:var(--bd);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .4s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-top:14px}
.tag{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.q{font-size:24px;font-weight:700;margin:8px 0 14px;line-height:1.3}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:16px;padding:12px 14px;margin:8px 0;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);cursor:pointer}
.opt:hover{border-color:var(--ac)}
.opt.ok{background:var(--ac);color:#fff;border-color:var(--ac)}
.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.msg{min-height:22px;margin-top:8px;font-size:15px}
.btn{font:inherit;font-weight:600;padding:12px 20px;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer;margin-top:10px}
.big{font-size:20px;font-weight:700}
</style>
</head>
<body>
<div class="w">
  <h1>🎓 Tuition Quest</h1>
  <div class="sub">Заработай 10 grand на семестр. Правильный ответ даёт деньги, ошибка отнимает стипендию.</div>
  <div class="hud"><span id="money">$0</span><span id="lives"></span><span id="streak"></span></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="card" id="card"></div>
</div>
<script>
var V=[
{en:"fourth year",ru:"четвёртый курс",s:"I’m in my ___ at the university."},
{en:"to graduate",ru:"заканчивать университет",s:"I hope to ___ next semester."},
{en:"semester",ru:"семестр",s:"One ___ costs a lot of money."},
{en:"in-state student",ru:"студент из своего штата",s:"As an ___, I pay less than other students."},
{en:"originally",ru:"изначально, по происхождению",s:"I’m ___ from Bangladesh."},
{en:"to reside",ru:"проживать",s:"I actually ___ in the Detroit area."},
{en:"per semester",ru:"за семестр",s:"It’s nearly ten grand ___."},
{en:"grand",ru:"тысяча долларов (разг.)",s:"It costs ten ___, so $10,000."},
{en:"nearly",ru:"почти"},
{en:"almost",ru:"почти"},
{en:"to rise",ru:"расти, дорожать",s:"I just keep seeing the price ___."},
{en:"I don’t think it will be any lower",ru:"не думаю, что станет дешевле"},
{en:"to work two jobs",ru:"работать на двух работах",s:"To pay for school, I ___ on campus."},
{en:"campus",ru:"кампус, территория университета",s:"I work at two jobs on ___."},
{en:"support from parents",ru:"помощь от родителей",s:"Do you have any ___ or anything like that?"},
{en:"mostly",ru:"в основном",s:"It’s ___ me. I pay by myself."},
{en:"fortunate",ru:"удачливый, везучий",s:"I’ve been ___ through scholarships."},
{en:"scholarship",ru:"стипендия, грант",s:"I got a ___, so it’s easier to pay."},
{en:"I guess",ru:"наверное, пожалуй",s:"I’ve been lucky, ___."}
];
var G,money,lives,streak,queue,cur,locked;
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function $(id){return document.getElementById(id)}
function start(){money=0;lives=3;streak=0;queue=[];next()}
function hud(){$("money").textContent="$"+money.toLocaleString("en-US");$("lives").textContent="🎓".repeat(lives)+"·".repeat(3-lives);$("streak").textContent=streak>1?"🔥 ×"+streak:"";$("fill").style.width=Math.min(100,money/100)+"%"}
function next(){
  hud();
  if(money>=10000){return end(true)}
  if(lives<=0){return end(false)}
  if(!queue.length)queue=sh(V);
  cur=queue.pop();locked=false;
  var types=["en2ru","ru2en"].filter(function(t){return !(t==="ru2en"&&cur.ru==="почти")});
  if(cur.s)types.push("gap","gap");
  var t=types[Math.floor(Math.random()*types.length)];
  var q,tag,ans,key;
  if(t==="en2ru"){tag="Переведи на русский";q=cur.en;ans=cur.ru;key="ru"}
  else if(t==="ru2en"){tag="Как это по-английски?";q=cur.ru;ans=cur.en;key="en"}
  else{tag="Вставь слово";q=cur.s;ans=cur.en;key="en"}
  var pool=sh(V).filter(function(x){return x[key]!==ans&&!(key==="en"&&t==="gap"&&(x.en==="nearly"||x.en==="almost"))}).slice(0,3).map(function(x){return x[key]});
  var opts=sh(pool.concat(ans));
  var h='<div class="tag">'+tag+'</div><div class="q">'+q.replace("___","<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>")+'</div>';
  opts.forEach(function(o,i){h+='<button class="opt" data-i="'+i+'">'+o+'</button>'});
  h+='<div class="msg" id="msg"></div>';
  $("card").innerHTML=h;
  var bs=document.querySelectorAll(".opt");
  bs.forEach(function(b){b.onclick=function(){pick(b,ans,bs,t)}});
}
function pick(b,ans,bs,t){
  if(locked)return;locked=true;
  var good=b.textContent===ans;
  bs.forEach(function(x){if(x.textContent===ans)x.classList.add("ok")});
  if(good){streak++;var gain=500+Math.min(streak-1,4)*100;money+=gain;$("msg").textContent="✅ +$"+gain+(streak>2?" (бонус за серию!)":"")}
  else{b.classList.add("no");streak=0;lives--;money=Math.max(0,money-200);$("msg").textContent="❌ Потеряна стипендия, −$200. Правильно: "+ans}
  if(t==="gap"&&cur.s)$("msg").textContent+="  ·  "+cur.s.replace("___",cur.en);
  hud();
  var n=document.createElement("button");n.className="btn";n.textContent="Дальше →";n.onclick=next;$("card").appendChild(n);
}
function end(win){
  $("card").innerHTML=win?'<div class="big">🎉 You graduated!</div><p>Ты накопил 10 grand и оплатил семестр. Отличная работа!</p>':'<div class="big">😢 Out of scholarships</div><p>Стипендии закончились. Повтори слова и попробуй ещё раз.</p>';
  var b=document.createElement("button");b.className="btn";b.textContent="Играть снова";b.onclick=start;$("card").appendChild(b);
}
start();
</script>
</body>
</html>
